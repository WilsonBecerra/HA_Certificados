name: Generador de Diplomas Automático

on:
  repository_dispatch:
    types: [generar_diplomas]

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar LibreOffice (para conversión PPTX a PDF)
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice fonts-liberation

      - name: Instalar Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Orquestador de Diplomas
        env:
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
        run: |
          python generate_diplomas.py
