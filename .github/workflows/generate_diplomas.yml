name: Generador de Diplomas Automático

on:
  repository_dispatch:
    types: [generar_diplomas]

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar LibreOffice Minimal y Fontconfig
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-core \
            libreoffice-impress \
            fontconfig

      - name: Registrar Fuentes Personalizadas (Montserrat, Open Sans, Calibri)
        run: |
          mkdir -p ~/.local/share/fonts
          cp -r fonts/* ~/.local/share/fonts/ 2>/dev/null || true
          fc-cache -f -v

      - name: Instalar Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Orquestador de Diplomas
        env:
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
        run: |
          python generate_diplomas.py
